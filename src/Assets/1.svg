<svg
    width="200px"
    height="200px"
    viewBox="0 0 200 200"
    xmlns="http://www.w3.org/2000/svg"
    style="filter: drop-shadow(0 0 20px rgba(128, 0, 128, 1));"
>
    <defs>
        <radialGradient id="gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color: rgba(0, 255, 255, 0.5);" />
            <stop offset="100%" style="stop-color: rgba(128, 0, 128, 0.5);" />
        </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="100" fill="url(#gradient)" />
    <clipPath id="clip-circle">
        <circle cx="100" cy="100" r="100" />
    </clipPath>
    <image
        href="path_to_your_image.jpg" <!-- Replace with your image path -->
        x="0"
        y="0"
        width="200"
        height="200"
        clip-path="url(#clip-circle)"
        preserveAspectRatio="xMidYMid slice"
    />
</svg>
